<script>
  window.onload = function() {
    const sliderContainer = document.querySelector('.myteam-slider-container');
    const sliderWrapper = document.querySelector('.myteam-slider-wrapper');
    const slides = document.querySelectorAll('.myteam-slide');
    const arrowLeft = document.getElementById('myteam-arrow-left');
    const arrowRight = document.getElementById('myteam-arrow-right');
    const teamMembers = <?= json_encode($tim) ?>;
    
    // Tentukan jumlah slide yang terlihat dan indeks default center
    let visibleCount, defaultCenterIndex;
    if (window.innerWidth > 660) {
      visibleCount = 5;
      defaultCenterIndex = 2; // default center jika logika aktif
    } else {
      visibleCount = 3;
      defaultCenterIndex = 1;
    }
    
    // Flag untuk menentukan apakah logika centering aktif
    let disableCenterLogic = false;
    if (window.innerWidth > 660 && teamMembers.length <= 5) {
      // Jika layar di atas 660 dan anggota ≤ 5, nonaktifkan logika centering.
      disableCenterLogic = true;
      arrowLeft.style.display = "none";
      arrowRight.style.display = "none";
      
      // Jika jumlah anggota kurang dari 5, tampilkan slider mulai dari kiri (tanpa centering).
      sliderWrapper.style.justifyContent = "flex-start";
    } else {
      // Jika tidak, periksa apakah konten slider melebihi container,
      // sehingga tombol panah dapat ditampilkan.
      if (sliderWrapper.scrollWidth > sliderContainer.clientWidth) {
        arrowLeft.style.display = "block";
        arrowRight.style.display = "block";
      }
    }
    
    // Jika centering aktif, re-order slider sehingga foto default berada di posisi center.
    if (!disableCenterLogic) {
      for (let i = 0; i < defaultCenterIndex; i++) {
        sliderWrapper.insertBefore(sliderWrapper.lastElementChild, sliderWrapper.firstElementChild);
      }
    }
    
    // Fungsi untuk meng-update foto utama dan informasi berdasarkan data anggota.
    function updateMainPhoto(member, src) {
      document.getElementById('myteam-photo').src = src;
      document.getElementById('myteam-name').textContent = member.nama;
      document.getElementById('myteam-role').textContent = member.peran;
      
      // Update tautan media sosial
      const icon1 = document.getElementById('myteam-icon1');
      if (member.facebook && member.facebook.trim() !== "") {
        icon1.href = member.facebook;
        icon1.style.pointerEvents = "auto";
        icon1.style.opacity = "1";
      } else {
        icon1.href = "javascript:void(0)";
        icon1.style.pointerEvents = "none";
        icon1.style.opacity = "0.5";
      }
      const icon2 = document.getElementById('myteam-icon2');
      if (member.whatsapp && member.whatsapp.trim() !== "") {
        icon2.href = `https://wa.me/${member.whatsapp}`;
        icon2.style.pointerEvents = "auto";
        icon2.style.opacity = "1";
      } else {
        icon2.href = "javascript:void(0)";
        icon2.style.pointerEvents = "none";
        icon2.style.opacity = "0.5";
      }
      const icon3 = document.getElementById('myteam-icon3');
      if (member.twitter && member.twitter.trim() !== "") {
        icon3.href = member.twitter;
        icon3.style.pointerEvents = "auto";
        icon3.style.opacity = "1";
      } else {
        icon3.href = "javascript:void(0)";
        icon3.style.pointerEvents = "none";
        icon3.style.opacity = "0.5";
      }
      const icon4 = document.getElementById('myteam-icon4');
      if (member.instagram && member.instagram.trim() !== "") {
        icon4.href = member.instagram;
        icon4.style.pointerEvents = "auto";
        icon4.style.opacity = "1";
      } else {
        icon4.href = "javascript:void(0)";
        icon4.style.pointerEvents = "none";
        icon4.style.opacity = "0.5";
      }
    }
    
    // Fungsi untuk update foto utama berdasarkan posisi slide center.
    // Fungsi ini hanya dipakai jika logika centering aktif.
    function updateMainPhotoByCenter() {
      const centerIndex = window.innerWidth > 660 ? 2 : 1;
      const centerSlide = sliderWrapper.children[centerIndex];
      if (centerSlide) {
        const img = centerSlide.querySelector('img');
        const idx = img.dataset.index;
        updateMainPhoto(teamMembers[idx], img.src);
      }
    }
    
    // Jika logika centering dinonaktifkan, default foto utama adalah slide paling kiri.
    if (disableCenterLogic) {
      const firstSlide = sliderWrapper.children[0];
      if (firstSlide) {
        const img = firstSlide.querySelector('img');
        const idx = img.dataset.index;
        updateMainPhoto(teamMembers[idx], img.src);
      }
    } else {
      // Jika logika aktif, panggil update default berdasarkan foto yang berada di tengah.
      updateMainPhotoByCenter();
    }
    
    // Hitung lebar slide (asumsi setiap slide memiliki lebar yang sama + gap)
    const slideWidth = slides[0].offsetWidth + 5;
    
    // Jika logika centering aktif, pasang event tombol panah untuk infinite cycling.
    if (!disableCenterLogic) {
      arrowRight.addEventListener('click', () => {
        sliderWrapper.style.transition = "transform 0.3s ease-in-out";
        sliderWrapper.style.transform = `translateX(-${slideWidth}px)`;
        
        sliderWrapper.addEventListener('transitionend', function handler() {
          sliderWrapper.style.transition = "none";
          sliderWrapper.appendChild(sliderWrapper.firstElementChild);
          sliderWrapper.style.transform = "translateX(0)";
          sliderWrapper.removeEventListener('transitionend', handler);
          updateMainPhotoByCenter();
        });
      });
  
      arrowLeft.addEventListener('click', () => {
        sliderWrapper.style.transition = "none";
        sliderWrapper.insertBefore(sliderWrapper.lastElementChild, sliderWrapper.firstElementChild);
        sliderWrapper.style.transform = `translateX(-${slideWidth}px)`;
        sliderWrapper.offsetHeight; // force reflow
        sliderWrapper.style.transition = "transform 0.3s ease-in-out";
        sliderWrapper.style.transform = "translateX(0)";
        sliderWrapper.addEventListener('transitionend', function handler() {
          sliderWrapper.removeEventListener('transitionend', handler);
          updateMainPhotoByCenter();
        });
      });
  
      // Fungsi untuk memusatkan slide yang diklik.
      function centerClickedSlide(clickedSlide) {
        const slideArray = Array.from(sliderWrapper.children);
        const currentIndex = slideArray.indexOf(clickedSlide);
        const centerIndex = window.innerWidth > 660 ? 2 : 1;
        const diff = currentIndex - centerIndex;
        
        if (diff !== 0) {
          sliderWrapper.style.transition = "transform 0.3s ease-in-out";
          sliderWrapper.style.transform = diff > 0 
            ? `translateX(-${diff * slideWidth}px)`
            : `translateX(${Math.abs(diff) * slideWidth}px)`;
          
          sliderWrapper.addEventListener('transitionend', function handler() {
            sliderWrapper.style.transition = "none";
            if (diff > 0) {
              for (let i = 0; i < diff; i++) {
                sliderWrapper.appendChild(sliderWrapper.firstElementChild);
              }
            } else {
              for (let i = 0; i < Math.abs(diff); i++) {
                sliderWrapper.insertBefore(sliderWrapper.lastElementChild, sliderWrapper.firstElementChild);
              }
            }
            sliderWrapper.style.transform = "translateX(0)";
            sliderWrapper.removeEventListener('transitionend', handler);
            updateMainPhotoByCenter();
          });
        } else {
          updateMainPhotoByCenter();
        }
      }
  
      // Ketika foto di slider diklik, panggil fungsi centerClickedSlide.
      document.querySelectorAll('.myteam-photo-item').forEach(img => {
        img.addEventListener('click', function() {
          const clickedSlide = this.parentElement;
          centerClickedSlide(clickedSlide);
        });
      });
      
    } else {
      // Jika centering dinonaktifkan, saat foto di klik hanya update foto utama tanpa merubah posisi slide.
      document.querySelectorAll('.myteam-photo-item').forEach(img => {
        img.addEventListener('click', function() {
          const idx = this.dataset.index;
          updateMainPhoto(teamMembers[idx], this.src);
        });
      });
    }
  };
</script>
